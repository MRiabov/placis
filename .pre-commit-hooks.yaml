- id: check-dont-say
  name: Don't-say glossary check
  description: Fail if glossary Don't-say terms appear in docs or Go. A missing or unparseable Don't-say table is a failure.
  entry: go run ./cmd/ci/check-dont-say
  language: system
  files: '^(docs|internal|cmd|migrations|catalog|apps/contractor-website|apps/placis-website|scripts)/.*\.(md|go|mjs|js)$'
  pass_filenames: true

- id: check-pipeline-tables
  name: Pipeline table and heading check
  description: Pair pipeline steps with testing files, require persistence tables in testing.md or pipeline/testing, close pipeline step headings, ratchet feature api.md headings, and require TestPipelineHappyPath* (leftover until Go tests exist).
  entry: go run ./cmd/ci/check-pipeline-tables
  language: system
  files: '^docs/features/.*/(persistence|testing|api)\.md$|^docs/features/.*/pipeline/.*\.md$|^docs/general-architecture/jobs.md$|^internal/.*_test\.go$'
  pass_filenames: true

- id: check-happy-path
  name: HappyPath OpenAPI 1:1
  description: Fail if a public OpenAPI operation has no 1:1 TestHappyPath* that hits exactly that Method+path. No-ops when openapi.json is absent.
  entry: go run ./cmd/ci/check-happy-path --public
  language: system
  files: '^internal/.*_test\.go$|^openapi\.json$|^cmd/ci/check-happy-path/'
  pass_filenames: false

- id: check-docs-code
  name: Docs–code named identifiers
  description: Fail if OpenAPI, Go, or SQL names a path, DTO, River job kind, or table that is not in docs, and ratchet docs-to-OpenAPI leftover after a feature appears in OpenAPI.
  entry: go run ./cmd/ci/check-docs-code
  language: system
  files: '^docs/.*\.md$|^internal/|^cmd/|^migrations/|^openapi\.json$|^apps/contractor-website/openapi\.json$'
  pass_filenames: false
