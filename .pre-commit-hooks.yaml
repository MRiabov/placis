- id: check-dont-say
  name: Don't-say glossary check
  description: Fail if glossary Don't-say terms appear in docs or Go. A missing or unparseable Don't-say table is a failure.
  entry: go run ./cmd/ci/check-dont-say
  language: system
  files: '^(docs|internal|cmd|migrations|catalog|apps/contractor-website|apps/placis-website|scripts)/.*\.(md|go|mjs|js)$'
  pass_filenames: true

- id: check-pipeline-tables
  name: Pipeline table and heading check
  description: Pair pipeline steps with testing files, require persistence tables in testing.md or pipeline/testing, close pipeline step headings, and ratchet feature api.md headings.
  entry: go run ./cmd/ci/check-pipeline-tables
  language: system
  files: '^docs/features/.*/(persistence|testing|api)\.md$|^docs/features/.*/pipeline/.*\.md$|^docs/general-architecture/jobs.md$'
  pass_filenames: true

- id: check-docs-code
  name: Docs–code named identifiers
  description: Fail if OpenAPI, Go, or SQL names a path, DTO, River job kind, or table that is not in docs, and ratchet docs-to-OpenAPI leftover after a feature appears in OpenAPI.
  entry: go run ./cmd/ci/check-docs-code
  language: system
  files: '^docs/.*\.md$|^internal/|^cmd/|^migrations/|^openapi\.json$|^apps/contractor-website/openapi\.json$'
  pass_filenames: false
