- id: check-dont-say
  name: Don't-say glossary check
  description: Fail if glossary Don't-say terms appear in docs or Go. A missing or unparseable Don't-say table is a failure.
  entry: go run ./cmd/ci/check-dont-say
  language: system
  files: '^(docs|internal|cmd|catalog|apps/contractor-website|apps/placis-website|scripts)/.*\.(md|go|mjs|js)$|^packages/website-components/.*\.(md|mjs|js|ts|tsx|json|css)$'
  pass_filenames: true

- id: check-pipeline-tables
  name: Pipeline table and heading check
  description: Pair pipeline steps with testing files, require persistence tables in testing.md or pipeline/testing, close pipeline step headings, ratchet feature api.md headings, and require TestPipelineHappyPath* (leftover until Go tests exist).
  entry: go run ./cmd/ci/check-pipeline-tables
  language: system
  files: '^docs/(features|infrastructure)/.*/(persistence|testing|api|jobs)\.md$|^docs/features/.*/pipeline/.*\.md$|^docs/infrastructure/jobs.md$|^internal/.*_test\.go$'
  pass_filenames: true

- id: check-happy-path
  name: HappyPath OpenAPI 1:1
  description: "Fail if a structured api.md Route has no 1:1 ### TestHappyPath* Exercise or no func TestHappyPath* that hits exactly that Method+path. leftover_docs.go and leftover_tests.go may only shrink. Spec walk no-ops when openapi.json is absent."
  entry: go run ./cmd/ci/check-happy-path --public
  language: system
  files: '^internal/.*_test\.go$|^openapi\.json$|^cmd/ci/check-happy-path/|^docs/.*/api\.md$|^docs/.*/testing\.md$'
  pass_filenames: false

- id: check-docs-code
  name: Docs–code named identifiers
  description: Fail if OpenAPI, Go, or SQL names a path, DTO, River job kind, or table that is not in docs, and ratchet docs-to-OpenAPI leftover after a feature appears in OpenAPI.
  entry: go run ./cmd/ci/check-docs-code
  language: system
  files: '^docs/.*\.md$|^internal/|^cmd/|^openapi\.json$|^apps/contractor-website/openapi\.json$'
  pass_filenames: false

- id: check-api-dirs
  name: API home check
  description: Fail if HTTP is registered outside feature/api/, DTO structs live in Register files, SQL is outside store/goose, or TypeScript calls the API outside src/features/.
  entry: go run ./cmd/ci/check-api-dirs
  language: system
  files: '^internal/.*\.(go|sql)$|^cmd/api/|^migrations/.*\.sql$|^frontend-3/.*\.(ts|tsx)$|^apps/demo/.*\.(ts|tsx)$|^cmd/ci/check-api-dirs/'
  pass_filenames: true

- id: check-import-dag
  name: Import DAG check
  description: Fail if Go or frontend-3 imports a forbidden package edge from package-boundaries.md.
  entry: go run ./cmd/ci/check-import-dag
  language: system
  files: '^internal/.*\.go$|^cmd/api/|^frontend-3/.*\.(ts|tsx)$|^cmd/ci/check-import-dag/'
  pass_filenames: true

- id: check-file-size
  name: File-size and folder fan-out
  description: Warn at 800 lines, hard-fail at 1200 (look app 800). Nested internal/ and frontend-3/src/ dirs at most 9 entries; those roots at most 15.
  entry: go run ./cmd/ci/check-file-size --all
  language: system
  pass_filenames: false
  always_run: true
