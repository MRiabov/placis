name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Look app check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
