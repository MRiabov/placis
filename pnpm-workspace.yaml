  - '@cloudflare/workers-types@5.20260825.1'
  - '@tanstack/query-core@5.102.3'
  - '@tanstack/react-query@5.102.3'
  - '@types/node@26.3.0'
  - astro@7.2.6
  - lucide-react@1.34.0
  - '@tailwindcss/postcss@4.3.3'
  - '@tailwindcss/vite@4.3.3'
  - tailwindcss@4.3.3
