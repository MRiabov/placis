name: frontend-quality

on:
  pull_request:
    paths:
      - "apps/demo/**"
      - ".github/workflows/frontend-quality.yml"
      - "cmd/ci/check-dont-say/**"
      - "docs/glossary.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Look app check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/demo/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
