name: frontend-quality

on:
  pull_request:
    paths:
      - "apps/demo/**"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Look app check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/demo/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check . && pnpm exec tsc --noEmit && pnpm exec knip && node scripts/check-tokens.mjs
      - run: pnpm build
