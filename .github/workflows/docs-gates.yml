name: docs-gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-gates:
    name: Docs gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check formatting
        uses: rvben/rumdl@v0
        with:
          version: "0.2.62"
          command: fmt-check

      - name: Lint
        uses: rvben/rumdl@v0
        with:
          version: "0.2.62"
          command: check

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Test checkers
        run: go test ./cmd/ci/check-dont-say ./cmd/ci/docnames ./cmd/ci/check-docs-code ./cmd/ci/check-pipeline-tables ./cmd/ci/check-happy-path

      - name: Don't-say glossary check
        run: go run ./cmd/ci/check-dont-say --all

      - name: Docs–code named identifiers
        run: go run ./cmd/ci/check-docs-code --all

      - name: Pipeline table and heading check
        run: |
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- 'docs/features/**/persistence.md' || true)
          fi
          # shellcheck disable=SC2086
          go run ./cmd/ci/check-pipeline-tables --all $changed

      - name: HappyPath OpenAPI 1:1
        run: go run ./cmd/ci/check-happy-path --public
