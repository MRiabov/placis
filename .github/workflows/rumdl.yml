name: rumdl

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rumdl:
    name: Markdown format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        uses: rvben/rumdl@v0
        with:
          version: "0.2.62"
          command: fmt-check

      - name: Lint
        uses: rvben/rumdl@v0
        with:
          version: "0.2.62"
          command: check
