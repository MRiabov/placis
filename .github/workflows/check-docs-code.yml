name: check-docs-code

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-code:
    name: Docs–code named identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test checker
        run: go test ./cmd/ci/docnames ./cmd/ci/check-docs-code

      - name: Scan named identifiers
        run: go run ./cmd/ci/check-docs-code --all
