name: check-dont-say

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dont-say:
    name: Don't-say glossary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test checker
        run: go test ./cmd/ci/check-dont-say

      - name: Scan enabled trees
        run: go run ./cmd/ci/check-dont-say --all
