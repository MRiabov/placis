# Install once per clone (worktrees share `.git/hooks`): `pre-commit install`.
# repo: local runs the working-tree checker. `repo: .` + `rev: HEAD` freezes the
# binary at first install and never picks up checker changes. Go's build cache
# keeps `go run` cheap after the first compile.
# frontend-3 is in scope but excluded until frontend work starts from the Go backend.
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.62
    hooks:
      - id: rumdl-fmt
        exclude: ^\.agents/
      # Whole-tree fmt --check / check on tracked Markdown (~0.2s). Staged-only
      # rumdl-fmt misses rebase leftovers; CI still scans the checkout.
      - id: rumdl-fmt
        alias: rumdl-fmt-check
        name: rumdl fmt --check (tracked)
        entry: bash scripts/rumdl-tracked.sh fmt --check
        pass_filenames: false
        always_run: true
      - id: rumdl
        name: rumdl check (tracked)
        entry: bash scripts/rumdl-tracked.sh check
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: demo-check
        name: demo biome and typecheck
        language: system
        entry: bash -lc 'cd apps/demo && pnpm check'
        pass_filenames: false
        files: ^apps/demo/
      - id: check-dont-say
        name: Don't-say glossary check
        language: system
        entry: go run ./cmd/ci/check-dont-say
        pass_filenames: true
        files: '^AGENTS\.md$|^(docs|internal|cmd|migrations|catalog|apps/contractor-website|apps/placis-website|scripts)/.*\.(md|go|mjs|js)$|^(apps/demo|src)/.*\.(md|go|mjs|js|ts|tsx)$'
      - id: check-pipeline-tables
        name: Pipeline table and heading check
        language: system
        entry: go run ./cmd/ci/check-pipeline-tables
        pass_filenames: true
        files: '^docs/features/.*/(persistence|testing|api)\.md$|^docs/features/.*/pipeline/.*\.md$|^docs/general-architecture/jobs.md$|^internal/.*_test\.go$'
      - id: check-happy-path
        name: HappyPath OpenAPI 1:1
        language: system
        entry: go run ./cmd/ci/check-happy-path --public
        pass_filenames: false
        files: '^internal/.*_test\.go$|^openapi\.json$|^cmd/ci/check-happy-path/|^docs/.*/api\.md$|^docs/.*/testing\.md$'
      - id: check-docs-code
        name: Docs–code named identifiers
        language: system
        entry: go run ./cmd/ci/check-docs-code
        pass_filenames: false
        files: '^docs/.*\.md$|^internal/|^cmd/|^migrations/|^openapi\.json$|^apps/contractor-website/openapi\.json$'
