# Install once per clone (worktrees share `.git/hooks`): `pre-commit install`.
# repo: local runs the working-tree checker. `repo: .` + `rev: HEAD` freezes the
# binary at first install and never picks up checker changes. Go's build cache
# keeps `go run` cheap after the first compile.
# frontend-2 is in scope but excluded until frontend work starts from the Go backend.
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.62
    hooks:
      - id: rumdl-fmt
        exclude: ^\.agents/
      - id: rumdl
        exclude: ^\.agents/
  - repo: local
    hooks:
      - id: demo-check
        name: demo biome and typecheck
        language: system
        entry: bash -lc 'cd apps/demo && pnpm check'
        pass_filenames: false
        files: ^apps/demo/
      - id: check-dont-say
        name: Don't-say glossary check
        language: system
        entry: go run ./cmd/ci/check-dont-say
        pass_filenames: true
        files: '^(docs|internal|cmd|migrations|catalog|apps/contractor-website|apps/placis-website|scripts)/.*\.(md|go|mjs|js)$|^(apps/demo|src)/.*\.(md|go|mjs|js|ts|tsx)$'
